name: HONOR repository bootstrap import
on:
  push:
    branches: [main]
    paths: [bootstrap/READY]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize staged repository
        run: |
          set -euo pipefail
          cat bootstrap/chunk_* > /tmp/honor.b64
          base64 -d /tmp/honor.b64 > /tmp/honor.tar.xz
          rm -rf /tmp/honor-import
          mkdir -p /tmp/honor-import
          tar -xJf /tmp/honor.tar.xz -C /tmp/honor-import
          rsync -a --delete --exclude .git --exclude .github/workflows/bootstrap-import.yml /tmp/honor-import/ ./
          rm -rf bootstrap
      - name: Commit imported canonical tree
        run: |
          git config user.name 'HONOR CI Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import HONOR C01 Repair Round 2 working tree'
          git push origin HEAD:main
