name: C01 CI
on:
  push:
  pull_request:
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: honor_test}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d honor_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      HONOR_TEST_CELERY_WORKER: "true"
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/honor_test
      TEST_DATABASE_APP_URL: postgresql://honor_app:dev-only-honor-app@localhost:5432/honor_test
      DATABASE_APP_URL: postgresql://honor_app:dev-only-honor-app@localhost:5432/honor_test
      HONOR_OWNER_USER_ID: 00000000-0000-0000-0000-000000000001
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_JWKS_URL: https://example.supabase.co/auth/v1/.well-known/jwks.json
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ci-local-redis-password-0123456789abcdef
      TEST_REDIS_URL: redis://:ci-local-redis-password-0123456789abcdef@localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.15'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Python dependencies from frozen lock
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Re-resolve Python graph against frozen pins
        run: |
          uv pip compile pyproject.toml --extra dev --python-version 3.13             --python-platform x86_64-unknown-linux-gnu --constraint requirements.lock             --no-header --no-annotate --output-file /tmp/requirements.regenerated.lock
          python scripts/compare_python_lock.py requirements.lock /tmp/requirements.regenerated.lock
      - name: Start authenticated Redis
        run: |
          docker run -d --name honor-redis-ci -p 6379:6379 redis:8.10.1             redis-server --protected-mode yes --appendonly no --requirepass "$REDIS_PASSWORD"
          for i in $(seq 1 20); do
            if docker exec honor-redis-ci redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then exit 0; fi
            sleep 1
          done
          docker logs honor-redis-ci
          exit 1
      - name: Start foundation Celery worker
        env:
          PYTHONPATH: services/worker
        run: |
          nohup python -m celery -A honor_worker.celery_app:app worker             --loglevel=WARNING --pool=solo --queues=foundation --concurrency=1             --pidfile=/tmp/honor-celery.pid --logfile=/tmp/honor-celery.log             >/tmp/honor-celery-launch.log 2>&1 &
          for i in $(seq 1 30); do
            if python -m celery -A honor_worker.celery_app:app inspect ping --timeout=1 2>/dev/null | grep -q pong; then exit 0; fi
            sleep 1
          done
          cat /tmp/honor-celery-launch.log || true
          cat /tmp/honor-celery.log || true
          exit 1
      - name: Static + frozen-contract + secret scan + lock checks
        run: |
          python scripts/static_acceptance.py
          python scripts/check_lockfiles.py
      - name: Python unit and integration tests
        run: python -m pytest -q -rs
      - name: Node dependencies from frozen lock
        run: npm ci --workspaces --include-workspace-root --ignore-scripts
      - name: Lockfiles remain unchanged after clean install
        run: git diff --exit-code -- package-lock.json requirements.lock
      - name: Web security tests
        run: npm run test:web
      - name: Web typecheck
        run: npm run typecheck
      - name: Web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example_not_live
          NEXT_PUBLIC_HONOR_BFF_BASE: /api/v1
          SUPABASE_URL: https://example.supabase.co
          HONOR_PUBLIC_ORIGIN: http://localhost:3000
          HONOR_OWNER_USER_ID: 00000000-0000-0000-0000-000000000001
          HONOR_INTERNAL_API_ORIGIN: http://api:8000
        run: npm run build
      - name: Docker image builds and web public-config bundle proof
        run: |
          docker build -t honor-api:c01 -f services/api/Dockerfile .
          docker build -t honor-worker:c01 -f services/worker/Dockerfile .
          ./scripts/test_web_public_config_image.sh
      - name: Compose configuration validation
        run: |
          sudo install -d -m 0750 /opt/honor/config /opt/honor/secrets
          sudo cp infrastructure/deployment/env/api.config.env.example /opt/honor/config/api.env
          sudo cp infrastructure/deployment/env/worker.config.env.example /opt/honor/config/worker.env
          sudo cp infrastructure/deployment/env/web.env.example /opt/honor/config/web.env
          sudo cp infrastructure/deployment/env/caddy.env.example /opt/honor/config/caddy.env
          sudo cp infrastructure/deployment/env/api.env.example /opt/honor/secrets/api.env
          sudo cp infrastructure/deployment/env/worker.env.example /opt/honor/secrets/worker.env
          sudo cp infrastructure/deployment/env/reconciler.env.example /opt/honor/secrets/reconciler.env
          sudo cp infrastructure/deployment/env/redis.env.example /opt/honor/secrets/redis.env
          sudo cp infrastructure/deployment/env/migration.env.example /opt/honor/secrets/migration.env
          sudo cp infrastructure/deployment/env/bootstrap.env.example /opt/honor/secrets/bootstrap.env
          sudo cp infrastructure/deployment/env/worker-monitor.env.example /opt/honor/secrets/worker-monitoring.env
          docker compose -f infrastructure/docker/compose.development.yml config >/dev/null
          docker compose -f infrastructure/docker/compose.production.yml --profile admin config >/dev/null
