name: HONOR Repository Bootstrap

on:
  push:
    branches: [c01-r2-sync]
    paths:
      - 'bootstrap/r2u/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c01-r2-sync
          fetch-depth: 0
      - name: Verify and unpack canonical C01 Round 2 tree
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/r2u/[0-9][0-9] > /tmp/honor.tar.xz.b64
          base64 --decode /tmp/honor.tar.xz.b64 > /tmp/honor.tar.xz
          echo 'd8788127fe9ddd65a79d01317678ee963805e993d50e5ad62ab971dd99808ed2  /tmp/honor.tar.xz' | sha256sum -c -
          git rm -rf .
          tar -xJf /tmp/honor.tar.xz -C .
          git add -A
          git config user.name 'HONOR C01 Builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'C01 Repair Round 2 canonical repository'
          git push --force-with-lease origin HEAD:main
