name: HONOR Repository Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and unpack canonical C01 tree
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bootstrap/honor.tar.xz.b64 > /tmp/honor.tar.xz
          echo '999672266be22cb7b657c90be795ce66f0cf5b9133dcc06dc0989ecbb07199b0  /tmp/honor.tar.xz' | sha256sum -c -
          git rm -rf .
          tar -xJf /tmp/honor.tar.xz -C .
          git add -A
          git config user.name 'HONOR C01 Builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'C01 Repair Round 2 canonical repository'
          git push origin HEAD:main
