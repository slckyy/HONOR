[project]
name = "honor-foundation"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "asyncpg==0.31.0",
  "redis==6.4.0",
  "celery==5.6.0",
  "boto3==1.40.28",
  "PyJWT[crypto]==2.10.1",
  "httpx==0.28.1",
  "jsonschema==4.25.1"
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.13.0"]
[tool.pytest.ini_options]
pythonpath = ["services/api", "services/worker", "services/intelligence", "services/media"]
testpaths = ["tests", "services/api/tests", "services/worker/tests", "services/intelligence/tests", "services/media/tests"]
markers = ["integration: requires local Postgres/Redis or explicit integration environment"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
