        - typed_value
        - confidence
        - evidence_snapshot_id
        - evidence_locator
        - verified_at
        - verified_by
        - schema_version
        additionalProperties: false
        allOf:
        - if:
            properties:
              knowledge_state:
                const: KNOWN
            required:
            - knowledge_state
          then:
            properties:
              typed_value:
                type: object
                properties:
                  value_type:
                    const: TIMESTAMP
                  value:
                    type: string
                    format: date-time
                additionalProperties: false
                required:
                - value_type
                - value
              evidence_snapshot_id:
                type: string
                format: uuid
              verified_at:
                type: string
                format: date-time
            required:
            - typed_value
            - evidence_snapshot_id
            - verified_at
        - if:
            properties:
              knowledge_state:
                const: NOT_APPLICABLE
            required:
            - knowledge_state
          then:
            properties:
              typed_value:
                type: 'null'
              evidence_snapshot_id:
                type: string
                format: uuid
              verified_at:
                type: string
                format: date-time
            required:
            - typed_value
            - evidence_snapshot_id
            - verified_at
        - if:
            properties:
              knowledge_state:
                const: UNKNOWN
            required:
            - knowledge_state
          then:
            properties:
              typed_value:
                type: 'null'
            required:
            - typed_value
        description: Immutable `last_verified_at` rule fact for one campaign_terms_snapshots.id rule-set snapshot. KNOWN typed_value
          is validated by HONOR_CAMPAIGN_RULE_REGISTRY.json key `last_verified_at`.
      description: Exact per-key immutable campaign rule fact. Each oneOf branch binds rule_key to that key’s registered typed_value
        schema; generic cross-key typed values cannot satisfy an incompatible rule key.
      x-honor-key-registry: HONOR_CAMPAIGN_RULE_REGISTRY.json
