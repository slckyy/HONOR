    EditPlanV1:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://honor.local/jsonschema/edit_plan.v1.json
      title: edit_plan.v1
      x-honor-contract-class: STRUCTURED_FROZEN_V1
      x-honor-writer: media|intelligence
      type: object
      properties:
        schema_version:
          const: 1
        plan_version:
          type: integer
          minimum: 1
        candidate_id:
          type: string
          format: uuid
        source_asset_id:
          type: string
          format: uuid
        source_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        campaign_rule_snapshot_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 1
          uniqueItems: true
          description: 'V1 compatibility field with exactly one item: the authoritative immutable sealed campaign rule snapshot
            for this edit plan.'
        source_rights_id:
          type: string
          format: uuid
        source_rights_record_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        supersedes_edit_plan_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        plan_fingerprint_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        fingerprint_rule:
          const: SHA256_RFC8785_CANONICAL_JSON_EXCLUDING_plan_fingerprint_sha256
        timeline:
          type: object
          properties:
            timing_guard:
              const: WORD_OR_PHONEME_BOUNDARY_WHEN_TIMING_AVAILABLE
            cuts:
              type: array
              items:
                type: object
                properties:
                  cut_id:
                    type: string
                    pattern: ^[A-Za-z0-9._-]{1,80}$
                  source_start_ms:
                    type: integer
                    minimum: 0
                  source_end_ms:
                    type: integer
                    minimum: 1
                  output_start_ms:
                    type: integer
                    minimum: 0
                  output_end_ms:
                    type: integer
                    minimum: 1
                  reason:
                    type: string
                    enum:
                    - HOOK
                    - CONTEXT
                    - CONTENT
                    - DEAD_AIR_TIGHTENING
                    - PACING
                    - OTHER
                  boundary_alignment:
                    type: string
                    enum:
                    - WORD_BOUNDARY
                    - PHONEME_BOUNDARY
                    - FRAME_ONLY_NO_TIMING_DATA
                  source_word_start_id:
                    anyOf:
                    - type: string
                      maxLength: 100
                    - type: 'null'
                  source_word_end_id:
                    anyOf:
                    - type: string
                      maxLength: 100
                    - type: 'null'
                  transition:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - CUT
                        - DISSOLVE
                        - DIP_TO_BLACK
                      duration_ms:
                        type: integer
                        minimum: 0
                        maximum: 1000
                    additionalProperties: false
                    required:
                    - type
                    - duration_ms
                  playback_rate:
                    type: number
                    minimum: 0.25
                    maximum: 4
                additionalProperties: false
                required:
                - cut_id
                - source_start_ms
                - source_end_ms
                - output_start_ms
                - output_end_ms
                - reason
                - boundary_alignment
                - source_word_start_id
                - source_word_end_id
                - transition
                - playback_rate
              minItems: 1
              maxItems: 250
            dead_air_decisions:
              type: array
              items:
                type: object
                properties:
                  source_start_ms:
                    type: integer
                    minimum: 0
                  source_end_ms:
                    type: integer
                    minimum: 1
                  action:
                    type: string
                    enum:
                    - REMOVE
                    - SHORTEN
                    - KEEP
                  retained_duration_ms:
                    type: integer
                    minimum: 0
                  reason:
                    type: string
                    minLength: 1
                    maxLength: 500
                additionalProperties: false
                required:
                - source_start_ms
                - source_end_ms
                - action
                - retained_duration_ms
                - reason
              minItems: 0
              maxItems: 250
          additionalProperties: false
          required:
          - timing_guard
          - cuts
          - dead_air_decisions
        layout:
          type: object
          properties:
            safe_frame:
              type: object
              properties:
                left:
                  type: number
                  minimum: 0
                  maximum: 0.4
                right:
                  type: number
                  minimum: 0
                  maximum: 0.4
                top:
                  type: number
                  minimum: 0
                  maximum: 0.4
                bottom:
                  type: number
                  minimum: 0
                  maximum: 0.4
              additionalProperties: false
              required:
              - left
              - right
              - top
              - bottom
            events:
              type: array
              items:
                type: object
                properties:
                  start_ms:
                    type: integer
                    minimum: 0
                  end_ms:
                    type: integer
                    minimum: 1
                  mode:
                    type: string
                    enum:
                    - ACTIVE_SPEAKER
                    - FACE_TRACK
                    - CENTER_SAFE
                    - SPLIT
                    - STACKED
                    - PODCAST
                  speaker_ids:
                    type: array
                    items:
                      type: string
                      maxLength: 100
                    minItems: 0
                    maxItems: 4
                    uniqueItems: true
                  center_x:
                    type: number
                    minimum: 0
                    maximum: 1
                  center_y:
                    type: number
                    minimum: 0
                    maximum: 1
                  scale:
                    type: number
                    minimum: 1
                    maximum: 2.25
                  pan_x:
                    type: number
                    minimum: -1
                    maximum: 1
                  pan_y:
                    type: number
                    minimum: -1
                    maximum: 1
                  confidence:
                    type: number
                    minimum: 0
                    maximum: 1
                additionalProperties: false
                required:
                - start_ms
                - end_ms
                - mode
                - speaker_ids
                - center_x
                - center_y
                - scale
                - pan_x
                - pan_y
                - confidence
              minItems: 1
              maxItems: 600
            speaker_switches:
              type: array
              items:
                type: object
                properties:
                  at_ms:
                    type: integer
                    minimum: 0
                  from_speaker_id:
                    anyOf:
                    - type: string
                      maxLength: 100
                    - type: 'null'
                  to_speaker_id:
                    type: string
                    minLength: 1
                    maxLength: 100
                  transition_ms:
                    type: integer
                    minimum: 0
                    maximum: 1000
                additionalProperties: false
                required:
                - at_ms
                - from_speaker_id
                - to_speaker_id
                - transition_ms
              minItems: 0
              maxItems: 200
            punch_ins:
              type: array
              items:
                type: object
                properties:
                  start_ms:
                    type: integer
                    minimum: 0
                  end_ms:
                    type: integer
                    minimum: 1
                  scale:
                    type: number
                    minimum: 1
                    maximum: 2.25
                  reason:
                    type: string
                    enum:
                    - EMPHASIS
                    - SPEAKER_CHANGE
                    - HOOK
                    - PAYOFF
                additionalProperties: false
                required:
                - start_ms
                - end_ms
                - scale
                - reason
              minItems: 0
              maxItems: 100
            reframing_mode:
              type: string
              enum:
              - CROP_ALLOWED
              - FIT_NO_CROP
          additionalProperties: false
          required:
          - reframing_mode
          - safe_frame
          - events
          - speaker_switches
          - punch_ins
        captions:
          type: object
          properties:
            style_ref:
              type: string
              minLength: 1
              maxLength: 200
            timing_mode:
              type: string
              enum:
              - PHRASE
              - WORD
            safe_placement:
              const: true
            max_lines:
              type: integer
              enum:
              - 1
              - 2
              - 3
            chunks:
              type: array
              items:
                type: object
                properties:
                  start_ms:
                    type: integer
                    minimum: 0
                  end_ms:
                    type: integer
                    minimum: 1
                  text:
                    type: string
                    minLength: 1
                    maxLength: 500
                  emphasis_tokens:
                    type: array
                    items:
                      type: string
                      maxLength: 100
                    minItems: 0
                    maxItems: 30
                additionalProperties: false
                required:
                - start_ms
                - end_ms
                - text
                - emphasis_tokens
              minItems: 0
              maxItems: 1200
            enabled:
              type: boolean
          additionalProperties: false
          required:
          - enabled
          - style_ref
          - timing_mode
          - safe_placement
          - max_lines
          - chunks
          allOf:
          - if:
              properties:
                enabled:
                  const: true
              required:
              - enabled
            then:
              properties:
                chunks:
                  minItems: 1
            else:
              properties:
                chunks:
                  maxItems: 0
        visual_emphasis:
          type: array
          items:
            type: object
            properties:
              start_ms:
                type: integer
                minimum: 0
              end_ms:
                type: integer
                minimum: 1
              type:
                type: string
                enum:
                - TEXT_ACCENT
                - CALLOUT
                - SUBTLE_ZOOM
                - FOCUS_SHIFT
              content:
                anyOf:
                - type: string
                  maxLength: 500
                - type: 'null'
              intensity:
                type: string
                enum:
                - LOW
                - MEDIUM
            additionalProperties: false
            required:
            - start_ms
            - end_ms
            - type
            - content
            - intensity
          minItems: 0
          maxItems: 100
        audio_cleanup:
          type: object
          properties:
            dialogue_normalization:
              type: boolean
            target_integrated_lufs:
              type: number
              minimum: -24
              maximum: -10
            true_peak_ceiling_dbtp:
              type: number
              minimum: -6
              maximum: -0.1
            noise_handling:
              type: string
              enum:
              - NONE
              - LIGHT
              - ADAPTIVE
            limiter_enabled:
              const: true
            preserve_natural_dynamics:
              type: boolean
          additionalProperties: false
          required:
          - dialogue_normalization
          - target_integrated_lufs
          - true_peak_ceiling_dbtp
          - noise_handling
          - limiter_enabled
          - preserve_natural_dynamics
        audio_plan_reference:
          type: object
          properties:
            audio_plan_required:
              type: boolean
            audio_plan_id:
              anyOf:
              - type: string
                format: uuid
              - type: 'null'
            separation_rule:
              const: RENDER_SAFE_AUDIO_SEPARATE_FROM_PLATFORM_NATIVE_RECOMMENDATION
          additionalProperties: false
          required:
          - audio_plan_required
          - audio_plan_id
          - separation_rule
        output:
          type: object
          properties:
            canvas_width:
              const: 1080
            canvas_height:
              const: 1920
            aspect_ratio:
              const: '9:16'
            fps:
              type: integer
              enum:
              - 30
              - 60
            target_codec:
              const: H264
            uniqueness_inputs:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 200
              minItems: 1
              maxItems: 50
              uniqueItems: true
            render_manifest_schema_id:
              const: render_manifest.v1
            renderer_must_record_plan_hash:
              const: true
            watermark:
              const: false
            render_manifest_id:
              type: string
              format: uuid
            expected_duration_ms:
              type: integer
              minimum: 1
              maximum: 600000
            edit_signature_sha256:
              type: string
              pattern: ^[a-f0-9]{64}$
          additionalProperties: false
          required:
          - canvas_width
          - canvas_height
          - aspect_ratio
          - fps
          - target_codec
          - uniqueness_inputs
          - render_manifest_id
          - render_manifest_schema_id
          - renderer_must_record_plan_hash
          - watermark
          - expected_duration_ms
          - edit_signature_sha256
        rule_compliance:
          type: object
          properties:
            rule_snapshot_id:
              type: string
              format: uuid
            evaluated_keys:
              type: array
              items:
                type: string
