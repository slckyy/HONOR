                              - PER_1000_VIEWS
                              - PER_QUALIFIED_ACTION
                              - OTHER
                            unit_description:
                              anyOf:
                              - type: string
                                maxLength: 500
                              - type: 'null'
                          additionalProperties: false
                          required:
                          - amount
                          - basis
                          - unit_description
                      additionalProperties: false
                      required:
                      - value_type
                      - value
                  - type: 'null'
                evidence_upload_id:
                  anyOf:
                  - type: string
                    format: uuid
                  - type: 'null'
                note:
                  anyOf:
                  - type: string
                    maxLength: 2000
                  - type: 'null'
              additionalProperties: false
              required:
              - resolution_type
              - decision
              - rule_key
              - typed_value
              - evidence_upload_id
              - note
            - type: object
              properties:
                resolution_type:
                  const: SOURCE_RIGHTS
                decision:
                  type: string
                  enum:
                  - AUTHORIZED
                  - NOT_AUTHORIZED
                  - UNKNOWN
                source_id:
                  type: string
                  format: uuid
                evidence_upload_id:
                  anyOf:
                  - type: string
                    format: uuid
                  - type: 'null'
                note:
                  anyOf:
                  - type: string
                    maxLength: 2000
                  - type: 'null'
              additionalProperties: false
              required:
              - resolution_type
              - decision
              - source_id
              - evidence_upload_id
              - note
            - type: object
              properties:
                resolution_type:
                  const: PROVIDER_SETUP
                decision:
                  type: string
                  enum:
                  - COMPLETED
                  - DEFERRED
                  - BLOCKED
                provider:
                  type: string
                  minLength: 1
                  maxLength: 100
                note:
                  anyOf:
                  - type: string
                    maxLength: 2000
                  - type: 'null'
              additionalProperties: false
              required:
              - resolution_type
              - decision
              - provider
              - note
            - type: object
              properties:
