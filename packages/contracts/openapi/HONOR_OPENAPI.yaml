                - campaign_url
                - external_campaign_id
                - status
                - compensation_model
                - cpm_or_rate
                - minimum_views
                - max_payout_per_clip
                - total_budget
                - remaining_budget
                - start_at
                - end_at
                - deadline_at
                - eligible_platforms
                - eligible_regions
                - eligible_account_requirements
                - required_tags
                - required_mentions
                - required_hashtags
                - disclosure_requirements
                - source_material_restrictions
                - clip_length_min_seconds
                - clip_length_max_seconds
                - content_restrictions
                - editing_restrictions
                - uniqueness_rules
                - submission_format
                - analytics_window
                - payout_window
                - render_audio_rules
                - platform_native_audio_rules
                - last_verified_at
              minItems: 1
              maxItems: 32
              uniqueItems: true
            blocked_unknown_keys:
              type: array
              items:
                type: string
                enum:
                - provider
                - campaign_url
                - external_campaign_id
                - status
                - compensation_model
                - cpm_or_rate
                - minimum_views
                - max_payout_per_clip
                - total_budget
                - remaining_budget
                - start_at
                - end_at
                - deadline_at
                - eligible_platforms
                - eligible_regions
                - eligible_account_requirements
                - required_tags
                - required_mentions
                - required_hashtags
                - disclosure_requirements
                - source_material_restrictions
                - clip_length_min_seconds
                - clip_length_max_seconds
                - content_restrictions
                - editing_restrictions
                - uniqueness_rules
                - submission_format
                - analytics_window
                - payout_window
                - render_audio_rules
                - platform_native_audio_rules
                - last_verified_at
              minItems: 0
              maxItems: 32
              uniqueItems: true
            effective_max_clip_seconds:
              anyOf:
              - type: number
                minimum: 1
                maximum: 600
              - type: 'null'
            effective_min_clip_seconds:
              anyOf:
              - type: number
                minimum: 0
                maximum: 600
              - type: 'null'
          additionalProperties: false
          required:
