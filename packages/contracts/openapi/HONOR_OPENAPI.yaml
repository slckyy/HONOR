      type: object
      properties:
        as_of:
          type: string
          format: date-time
        month:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
        cash_spend_counted_usd:
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{6}$
          description: Exact non-negative USD decimal string with six fractional digits.
        unpaid_committed_usd:
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{6}$
          description: Exact non-negative USD decimal string with six fractional digits.
        admitted_queued_unfunded_usd:
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{6}$
          description: Exact non-negative USD decimal string with six fractional digits.
        prepaid_funding_purchased_usd:
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{6}$
          description: Exact non-negative USD decimal string with six fractional digits.
        prepaid_credit_remaining_usd:
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{6}$
          description: Exact non-negative USD decimal string with six fractional digits.
        governor_exposure_usd:
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{6}$
          description: Exact non-negative USD decimal string with six fractional digits.
        projected_month_end_usd:
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{6}$
          description: Exact non-negative USD decimal string with six fractional digits.
        remaining_hard_cap_usd:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,11})\.[0-9]{6}$
          description: Exact USD decimal string with six fractional digits; never a JSON number.
        hard_cap_usd:
          type: string
          const: '56.030000'
        optional_pause_usd:
          type: string
          const: '43.000000'
        reserve_mode_usd:
          type: string
          const: '51.030000'
        governor_state:
          type: string
          enum:
          - NORMAL
          - OPTIONAL_PAUSED
          - RESERVE
          - HARD_STOP
        groups:
          type: array
          items:
            $ref: '#/components/schemas/CostGroup'
          minItems: 0
          maxItems: 100
      additionalProperties: false
      required:
      - as_of
      - month
      - cash_spend_counted_usd
      - unpaid_committed_usd
      - admitted_queued_unfunded_usd
      - prepaid_funding_purchased_usd
      - prepaid_credit_remaining_usd
      - governor_exposure_usd
      - projected_month_end_usd
      - remaining_hard_cap_usd
      - hard_cap_usd
      - optional_pause_usd
      - reserve_mode_usd
      - governor_state
      - groups
      description: Deterministic Month-1 cost governor snapshot. governor_exposure_usd = cash_spend_counted_usd + unpaid_committed_usd
        + admitted_queued_unfunded_usd using exact decimal arithmetic. NORMAL is exposure <43.000000; OPTIONAL_PAUSED is >=43.000000
        and <51.030000; RESERVE is >=51.030000 and <56.030000; HARD_STOP is >=56.030000. No new optional paid work may be
        admitted when exposure is >=43.000000. Every paid action is evaluated against post-admission exposure before dispatch.
        Prepaid funding is counted in full at purchase in cash_spend_counted_usd; later usage of that already-counted credit
        is not double-counted. projected_month_end_usd is informational and can never loosen admission. HONOR_COST_GOVERNOR.json
        is authoritative.
