openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: HONOR V1 Internal API
  version: 1.0.0-c00
  description: Canonical C00 machine contract. Browser reaches this contract only through the same-origin Next.js BFF; FastAPI
    itself is private-network-only.
servers:
- url: http://api:8000
  description: Private Docker network only
paths:
  /healthz:
    get:
      summary: Liveness
      operationId: healthz
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      x-honor-idempotency: not-required
      x-honor-authorization: public
      security: []
      description: Internal FastAPI liveness. Caddy exposes public /healthz and proxies here. Response is liveness-only and
        unauthenticated.
      x-honor-error-codes-by-status: {}
  /readyz:
    get:
      summary: Readiness
      operationId: readyz
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_readyz_503'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_readyz_401'
        '403':
          description: Authenticated non-owner forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_readyz_403'
      x-honor-idempotency: not-required
      x-honor-authorization: owner-jwt
      security:
      - ownerBearer: []
      description: Private detailed readiness. Owner-facing route is Next.js /api/readyz, which injects owner JWT and proxies
        to this internal FastAPI route.
      x-honor-error-codes-by-status:
        '401':
        - AUTH_INVALID
        - AUTH_REQUIRED
        '403':
        - OWNER_FORBIDDEN
        '503':
        - AUTH_PROVIDER_UNAVAILABLE
        - PROVIDER_UNAVAILABLE
  /v1/generation-runs:
    post:
      summary: Create generation run
      operationId: createGenerationRun
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRun'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_createGenerationRun_401'
        '403':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_createGenerationRun_403'
        '409':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_createGenerationRun_409'
        '422':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_createGenerationRun_422'
        '429':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_createGenerationRun_429'
        '503':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_createGenerationRun_503'
      x-honor-idempotency: required
      x-honor-authorization: owner-jwt
      security:
      - ownerBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationRunCreateRequest'
      x-honor-error-codes-by-status:
        '401':
        - AUTH_INVALID
        - AUTH_REQUIRED
        '403':
        - OWNER_FORBIDDEN
        '422':
        - IDEMPOTENCY_KEY_REQUIRED
        - VALIDATION_ERROR
        '429':
        - RATE_LIMITED
        '503':
        - AUTH_PROVIDER_UNAVAILABLE
        - COST_GOVERNOR_BLOCKED
        - PROVIDER_UNAVAILABLE
        '409':
        - IDEMPOTENCY_KEY_REUSED
