                      - RIGHTS_CAMPAIGN_LINK
                      - SOURCE_ORIGIN
                      - TRANSCRIPT_LEXICAL_SCAN
                      - CONTENT_SAFETY_REVIEW
                      - CLAIMS_EVIDENCE_REVIEW
                      - EDIT_OPERATION_AUDIT
                      - CAPTION_OVERLAY_AUDIT
                      - EDIT_SIGNATURE_COMPARISON
                      - OWNER_REVIEW
                    proof_sha256:
                      type: string
                      pattern: ^[a-f0-9]{64}$
                    target_type:
                      type: string
                      enum:
                      - SOURCE
                      - CANDIDATE
                      - EDIT_PLAN
                      - POSTING_RECOMMENDATION
                    target_id:
                      type: string
                      format: uuid
                    subject_sha256:
                      type: string
                      pattern: ^[a-f0-9]{64}$
                    evidenced_at:
                      type: string
                      format: date-time
                    result:
                      const: COMPLIANT
                    restriction_code:
                      type: string
                      enum:
                      - CAMPAIGN_AUTHORIZED_SOURCE_ONLY
                      - OWNER_OWNED_SOURCE_ONLY
                      - NO_THIRD_PARTY_SOURCE
                      - NO_PROFANITY
                      - BRAND_SAFE_ONLY
                      - NO_MISLEADING_CLAIMS
                      - NO_CROP
                      - NO_SPEED_CHANGE
                      - NO_TEXT_OVERLAY
                      - NO_REUSED_EDIT
                      - UNIQUE_PER_ACCOUNT
                      - UNIQUE_PER_CAMPAIGN
                  additionalProperties: false
                  required:
                  - proof_id
                  - proof_kind
                  - restriction_code
                  - proof_sha256
                  - target_type
                  - target_id
                  - subject_sha256
                  - evidenced_at
                  - result
                - type: 'null'
              owner_review_resolution_id:
                anyOf:
                - type: string
                  format: uuid
                - type: 'null'
            additionalProperties: false
            required:
            - code
            - effect
            - scope
            - result
            - proof_kind
            - proof_reference
            - owner_review_resolution_id
          minItems: 0
          maxItems: 12
          uniqueItems: true
      additionalProperties: false
      required:
      - schema_version
      - plan_version
      - candidate_id
      - source_asset_id
      - source_sha256
      - campaign_rule_snapshot_ids
      - source_rights_id
      - source_rights_record_hash
      - supersedes_edit_plan_id
      - plan_fingerprint_sha256
      - fingerprint_rule
      - timeline
      - layout
      - captions
      - visual_emphasis
      - audio_cleanup
      - audio_plan_reference
      - output
      - rule_compliance
      - disclosure_render
      - restriction_compliance
      x-honor-semantic-rules:
      - timeline.cuts are ordered by output_start_ms, do not overlap, and source_end_ms > source_start_ms / output_end_ms
        > output_start_ms
      - when word/phoneme timing exists, cut boundaries MUST align to a word or phoneme boundary; FRAME_ONLY_NO_TIMING_DATA
        is permitted only when timing data is unavailable
      - layout/visual/caption events use output timeline milliseconds and must lie inside the final output duration
      - plan_fingerprint_sha256 is SHA-256 of RFC8785 canonical JSON with plan_fingerprint_sha256 omitted
      description: ' V1 commits exactly one campaign rule snapshot; changed terms require a new edit/audio/clip lineage.'
    RenderManifestV1:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://honor.local/jsonschema/render_manifest.v1.json
      title: render_manifest.v1
      x-honor-contract-class: STRUCTURED_FROZEN_V1
      x-honor-writer: media
      type: object
      properties:
        schema_version:
          const: 1
        render_manifest_id:
          type: string
          format: uuid
        clip_id:
          type: string
          format: uuid
        source_asset_id:
          type: string
          format: uuid
        source_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        edit_plan_id:
          type: string
          format: uuid
        edit_plan_schema_version:
          const: 1
        edit_plan_version:
          type: integer
          minimum: 1
        edit_plan_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        audio_plan_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        audio_plan_schema_version:
          anyOf:
          - type: integer
            const: 1
          - type: 'null'
        audio_plan_version:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        audio_plan_hash:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        render_safe_assets:
          type: array
          items:
            type: object
            properties:
              audio_asset_id:
                type: string
                format: uuid
              sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
              license_reference:
                type: string
                minLength: 1
                maxLength: 1000
              kind:
                type: string
                enum:
                - MUSIC
                - SFX
            additionalProperties: false
            required:
            - audio_asset_id
            - sha256
            - license_reference
            - kind
          minItems: 0
          maxItems: 100
        renderer:
          type: object
          properties:
            honor_media_version:
              type: string
              minLength: 1
              maxLength: 100
            ffmpeg_version:
              type: string
              minLength: 1
              maxLength: 200
            opencv_version:
              type: string
              minLength: 1
              maxLength: 100
            container_image_digest:
              type: string
              pattern: ^[a-f0-9]{64}$
          additionalProperties: false
          required:
          - honor_media_version
          - ffmpeg_version
          - opencv_version
          - container_image_digest
        material_render_parameters:
          type: object
          properties:
            canvas_width:
              const: 1080
            canvas_height:
              const: 1920
            fps:
              type: integer
              enum:
              - 30
              - 60
            video_codec:
              const: H264
            audio_codec:
              type: string
              enum:
              - AAC
            pixel_format:
              type: string
              enum:
              - yuv420p
            target_integrated_lufs:
              type: number
              minimum: -24
              maximum: -10
            true_peak_ceiling_dbtp:
              type: number
              minimum: -6
              maximum: -0.1
          additionalProperties: false
          required:
          - canvas_width
          - canvas_height
          - fps
          - video_codec
          - audio_codec
          - pixel_format
          - target_integrated_lufs
          - true_peak_ceiling_dbtp
        output:
          type: object
          properties:
            object_key:
              type: string
              minLength: 1
              maxLength: 2000
            sha256:
              type: string
              pattern: ^[a-f0-9]{64}$
            file_size_bytes:
              type: integer
              minimum: 1
            duration_ms:
              type: integer
              minimum: 1
          additionalProperties: false
          required:
          - object_key
          - sha256
          - file_size_bytes
          - duration_ms
        qc_run_id:
          type: string
          format: uuid
        qc_version:
          type: string
          minLength: 1
          maxLength: 100
        qc_passed:
          const: true
        created_at:
          type: string
          format: date-time
        manifest_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        manifest_hash_rule:
          const: SHA256_RFC8785_CANONICAL_JSON_EXCLUDING_manifest_hash
        audio_rule_compliance:
          type: object
          properties:
            rule_snapshot_id:
              type: string
              format: uuid
            planned_music_asset_id:
              anyOf:
              - type: string
                format: uuid
              - type: 'null'
            planned_sfx_asset_ids:
              type: array
              items:
                type: string
                format: uuid
              uniqueItems: true
              minItems: 0
              maxItems: 200
            instructions_acknowledged:
              type: boolean
            verified_exact_asset_match:
              const: true
          additionalProperties: false
          required:
          - rule_snapshot_id
          - planned_music_asset_id
          - planned_sfx_asset_ids
          - instructions_acknowledged
          - verified_exact_asset_match
        campaign_disclosure:
          type: object
          properties:
            required:
              type: boolean
            placement:
              anyOf:
              - type: string
                enum:
                - CAPTION
                - VIDEO
                - BOTH
                - PROVIDER_SUBMISSION
              - type: 'null'
            rendered_in_video:
              type: boolean
            text_sha256:
              anyOf:
              - type: string
                pattern: ^[a-f0-9]{64}$
              - type: 'null'
          additionalProperties: false
          required:
          - required
          - placement
          - rendered_in_video
          - text_sha256
        campaign_rule_snapshot_id:
          type: string
          format: uuid
          description: Exact sole sealed campaign rule snapshot shared by edit plan, audio plan (if any), clip and posting
            recommendation.
      additionalProperties: false
      required:
      - schema_version
      - render_manifest_id
      - clip_id
      - source_asset_id
      - source_sha256
      - edit_plan_id
      - edit_plan_schema_version
      - edit_plan_version
      - edit_plan_hash
      - audio_plan_id
      - audio_plan_schema_version
      - audio_plan_version
      - audio_plan_hash
      - campaign_rule_snapshot_id
      - render_safe_assets
      - renderer
      - material_render_parameters
      - output
      - qc_run_id
      - qc_version
      - qc_passed
      - created_at
      - manifest_hash
      - manifest_hash_rule
      - audio_rule_compliance
      - campaign_disclosure
      allOf:
      - if:
          properties:
            audio_plan_id:
              type: 'null'
        then:
          properties:
            audio_plan_schema_version:
              type: 'null'
            audio_plan_version:
              type: 'null'
            audio_plan_hash:
              type: 'null'
        else:
          properties:
            audio_plan_schema_version:
              type: integer
              const: 1
            audio_plan_version:
              type: integer
              minimum: 1
            audio_plan_hash:
              type: string
              pattern: ^[a-f0-9]{64}$
      - if:
          properties:
            audio_plan_id:
              type: 'null'
          required:
          - audio_plan_id
        then:
          properties:
            audio_plan_hash:
              type: 'null'
            audio_plan_version:
              type: 'null'
            audio_plan_schema_version:
              type: 'null'
            render_safe_assets:
              maxItems: 0
      description: Immutable terminal manifest inserted only for the exact successful render/QC result that may enter READY.
x-honor-conventions:
  field_case: snake_case
  timestamps: RFC3339 UTC; producers emit Z
  money: USD decimal string with six fractional digits
  pagination: cursor
  browser_path_prefix: /api/v1
  fastapi_path_prefix: /v1
  hard_cap_usd: '56.03'
  optional_pause_usd: '43.00'
  reserve_mode_usd: '51.03'
x-honor-nextjs-auth-routes:
- method: GET
  path: /login
  auth: public
  purpose: render owner login
- method: POST
  path: /auth/login
  auth: public+same-origin+csrf
  purpose: signInWithPassword; set SSR cookies
- method: POST
  path: /auth/recover
  auth: public+same-origin+csrf
  purpose: request recovery email; generic 202
- method: GET
  path: /auth/confirm
  auth: public-token-hash
  query:
    token_hash: required string
    type: invite|recovery
  purpose: server-side verifyOtp; establish SSR session; redirect only to fixed set-password route
- method: GET
  path: /auth/set-password
  auth: owner-session
  purpose: render forced invite/recovery password update
- method: POST
  path: /auth/set-password
  auth: owner-session+same-origin+csrf
  purpose: update password; rotate csrf; redirect /app
- method: POST
  path: /auth/logout
  auth: owner-session+same-origin+csrf
  purpose: sign out; clear cookies; rotate csrf
x-honor-health-routing:
  internal_api_origin_env: HONOR_INTERNAL_API_ORIGIN
  internal_api_origin: http://api:8000
  public_liveness:
    public_path_env: HONOR_PUBLIC_HEALTH_PATH
    public_path: /healthz
    internal_path_env: HONOR_INTERNAL_LIVENESS_PATH
    internal_path: /healthz
    auth: public
    body: liveness-only
  owner_readiness:
    public_path_env: HONOR_OWNER_READINESS_PATH
    public_path: /api/readyz
    internal_path_env: HONOR_INTERNAL_READINESS_PATH
    internal_path: /readyz
    auth: owner-session at BFF + owner bearer to FastAPI
x-honor-production-routing:
  public_business: browser /api/v1/... -> Next.js BFF -> http://api:8000/v1/...
  public_liveness: Caddy /healthz -> http://api:8000/healthz
  private_readiness: browser /api/readyz -> Next.js BFF -> http://api:8000/readyz
  direct_public_fastapi_v1: false
  browser_cors_to_fastapi: false
x-honor-owner-action-resolution-schema: '#/components/schemas/OwnerActionResolutionV1'
x-honor-cost-governor-contract: HONOR_COST_GOVERNOR.json
x-honor-cost-governor:
  contract: HONOR_COST_GOVERNOR.json
  exposure_formula: cash_spend_counted_usd + unpaid_committed_usd + admitted_queued_unfunded_usd
  states:
    NORMAL: <43.000000
    OPTIONAL_PAUSED: '>=43.000000 and <51.030000'
    RESERVE: '>=51.030000 and <56.030000'
    HARD_STOP: '>=56.030000'
  optional_paid_at_or_above_43: false
  prepaid_face_value_counted_at_purchase: true
  post_admission_check_required: true
