      enum:
      - PENDING_UPLOAD
      - QUEUED
      - INGESTING
      - READY
      - BLOCKED_RIGHTS
      - FAILED
    SourceEligibility:
      type: string
      enum:
      - ELIGIBLE
      - INELIGIBLE
      - UNKNOWN
    ClipState:
      type: string
      enum:
      - PLANNED
      - RENDERING
      - QC
      - READY
      - EJECTED
      - POSTED
      - ARCHIVED
    PostStatus:
      type: string
      enum:
      - PUBLISHED
      - INVALIDATED
    SubmissionStatus:
      type: string
      enum:
      - NOT_REQUIRED
      - PENDING
      - SUBMITTED
      - ACCEPTED
      - REJECTED
      - UNKNOWN
    CheckinType:
      type: string
      enum:
      - H2
      - H24
      - H72
      - FINAL
      - CUSTOM
    CheckinStatus:
      type: string
      enum:
      - PENDING
      - DUE
      - COMPLETED
      - MISSED
      - NOT_APPLICABLE
